CP_METRICS_URL = "https://research-ops-metrics.seigo2016.com/metrics"

[[d1_databases]]
binding = "DB"
database_name = "garage-monitor"
database_id = "79a5d371-5afb-4486-992f-d3e85449509b"

[triggers]
crons = ["*/5 * * * *"]
