---
- name: Check installed rclone version
  ansible.builtin.command: rclone --version
  register: rclone_installed_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: Download rclone {{ rclone_version }} deb
  ansible.builtin.get_url:
    url: "{{ rclone_deb_url }}"
    dest: "/usr/local/src/rclone-v{{ rclone_version }}.deb"
    mode: "0644"
  when: ("v" ~ rclone_version) not in (rclone_installed_version.stdout | default(""))

- name: Install rclone {{ rclone_version }} from official deb
  ansible.builtin.apt:
    deb: "/usr/local/src/rclone-v{{ rclone_version }}.deb"
  when: ("v" ~ rclone_version) not in (rclone_installed_version.stdout | default(""))

- name: Read Garage credentials file
  ansible.builtin.slurp:
    src: /root/.garage-credentials
  register: garage_credentials_raw
  no_log: true

- name: Extract Garage access key
  ansible.builtin.set_fact:
    garage_local_access_key: >-
      {{ (garage_credentials_raw.content | b64decode
          | regex_search('Key ID:\s*(\S+)', '\1') | first) }}
    garage_local_secret_key: >-
      {{ (garage_credentials_raw.content | b64decode
          | regex_search('Secret key:\s*(\S+)', '\1') | first) }}
  no_log: true

- name: Create rclone config directory
  ansible.builtin.file:
    path: "{{ rclone_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Obscure rclone crypt password
  ansible.builtin.command:
    argv: [rclone, obscure, '-']
    stdin: "{{ vault_rclone_crypt_password }}"
  register: rclone_crypt_password_obscured
  changed_when: false
  check_mode: false
  no_log: true

- name: Obscure rclone crypt salt
  ansible.builtin.command:
    argv: [rclone, obscure, '-']
    stdin: "{{ vault_rclone_crypt_salt }}"
  register: rclone_crypt_salt_obscured
  changed_when: false
  check_mode: false
  no_log: true

- name: Check for existing rclone configuration
  ansible.builtin.stat:
    path: "{{ rclone_config_path }}"
  register: existing_rclone_config

- name: Verify existing rclone crypt key before replacement
  when: existing_rclone_config.stat.exists and not ansible_check_mode
  block:
    - name: Create temporary rclone configuration
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: garage-rclone-check-
      register: candidate_rclone_config

    - name: Render candidate rclone configuration
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: "{{ candidate_rclone_config.path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Encode probe with existing crypt key
      ansible.builtin.command:
        argv: [rclone, --config, "{{ rclone_config_path }}", backend, encode, "{{ backup_crypt_remote }}:", garage-key-check]
      register: existing_crypt_probe
      changed_when: false
      no_log: true

    - name: Encode probe with candidate crypt key
      ansible.builtin.command:
        argv: [rclone, --config, "{{ candidate_rclone_config.path }}", backend, encode, "{{ backup_crypt_remote }}:", garage-key-check]
      register: candidate_crypt_probe
      changed_when: false
      no_log: true

    - name: Reject changed crypt keys
      ansible.builtin.assert:
        that: existing_crypt_probe.stdout == candidate_crypt_probe.stdout
        fail_msg: >-
          Existing rclone crypt credentials do not match the Vault values.
          The existing configuration was not replaced; reconcile the secrets first.

  always:
    - name: Remove temporary rclone configuration
      ansible.builtin.file:
        path: "{{ candidate_rclone_config.path }}"
        state: absent
      when: candidate_rclone_config.path is defined

- name: Render rclone.conf
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ rclone_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install backup units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: garage-backup.service.j2, dest: garage-backup.service }
    - { src: garage-backup.timer.j2, dest: garage-backup.timer }
    - { src: garage-trash-cleanup.service.j2, dest: garage-trash-cleanup.service }
    - { src: garage-trash-cleanup.timer.j2, dest: garage-trash-cleanup.timer }
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Check for legacy metadata tar timer
  ansible.builtin.stat:
    path: /etc/systemd/system/garage-meta-snapshot.timer
  register: legacy_metadata_timer

- name: Disable legacy metadata tar timer
  ansible.builtin.systemd_service:
    name: garage-meta-snapshot.timer
    enabled: false
    state: stopped
  when: legacy_metadata_timer.stat.exists

- name: Configure backup timers
  ansible.builtin.systemd_service:
    name: garage-backup.timer
    enabled: "{{ backup_timers_enabled | bool }}"
    state: "{{ 'started' if backup_timers_enabled | bool else 'stopped' }}"
  when: backup_timers_enabled is not none

- name: Disable automatic backup trash cleanup
  ansible.builtin.systemd_service:
    name: garage-trash-cleanup.timer
    enabled: false
    state: stopped
