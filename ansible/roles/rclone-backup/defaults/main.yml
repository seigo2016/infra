---
# rclone itself is installed by the rclone role (meta dependency).
rclone_config_dir: /etc/rclone
rclone_config_path: "{{ rclone_config_dir }}/rclone.conf"

# Leave the existing timer unchanged unless explicitly enabled or disabled.
# A freshly installed timer is disabled until it is explicitly enabled.
backup_timers_enabled: null

garage_bucket: dvc
backup_r2_remote: r2-raw
backup_crypt_remote: r2-crypt
r2_bucket: data-store-backup
backup_dest_path: "{{ backup_crypt_remote }}:dvc-cache"
backup_trash_path_template: "{{ backup_crypt_remote }}:trash"

trash_retention_days: 30
