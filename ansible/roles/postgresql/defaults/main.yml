---
# PostgreSQL from the PGDG apt repository (apt.postgresql.org).
postgresql_version: 18
postgresql_cluster: main
postgresql_unit: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}.service"
postgresql_conf_dir: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}"
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}"
postgresql_bin_dir: "/usr/lib/postgresql/{{ postgresql_version }}/bin"

postgresql_pgdg_uri: https://apt.postgresql.org/pub/repos/apt
postgresql_pgdg_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc

postgresql_listen_addresses: localhost
postgresql_port: 5432

# WAL archiving. Off unless the caller enables it and supplies the command.
postgresql_archive_enabled: false
postgresql_archive_command: ""
# Upper bound on how long a quiet database keeps an unarchived WAL segment.
postgresql_archive_timeout: 60s

# Login roles and databases to create: [{name, owner, password}]. password
# must be alphanumeric (it is embedded in DATABASE_URL and SQL).
postgresql_databases: []
