---
- name: Ensure prerequisites for apt repository management
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Add Cloudflare apt signing key
  ansible.builtin.get_url:
    url: "{{ cloudflared_repo_key_url }}"
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"
    force: no

- name: Add cloudflared apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] {{ cloudflared_repo_url }} any main

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: yes

- name: Create the cloudflared configuration directory
  ansible.builtin.file:
    path: "{{ cloudflared_token_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# A changed token in the vault reaches the running tunnel on the next run.
- name: Write the tunnel token
  ansible.builtin.copy:
    dest: "{{ cloudflared_token_file }}"
    content: "TUNNEL_TOKEN={{ cloudflared_tunnel_token }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart cloudflared

- name: Install the cloudflared unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

- name: Ensure cloudflared is enabled and started
  ansible.builtin.systemd_service:
    name: cloudflared
    enabled: yes
    state: started
    daemon_reload: true
