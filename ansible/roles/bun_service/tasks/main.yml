---
- name: "[{{ bun_service_name | default('bun_service') }}] Validate arguments"
  ansible.builtin.assert:
    that:
      - bun_service_name is defined and bun_service_name is match('^[a-z0-9][a-z0-9-]*$')
      - bun_service_user is defined and bun_service_user | length > 0
      - bun_service_workdir is defined and bun_service_workdir is match('^/')
      - bun_service_entrypoint is defined and bun_service_entrypoint | length > 0
    fail_msg: bun_service requires bun_service_name, _user, _workdir and _entrypoint.

- name: "[{{ bun_service_name }}] Install systemd unit"
  ansible.builtin.template:
    src: bun.service.j2
    dest: "/etc/systemd/system/{{ bun_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: bun_service_unit

- name: "[{{ bun_service_name }}] Enable and start"
  ansible.builtin.systemd_service:
    name: "{{ bun_service_name }}"
    daemon_reload: "{{ bun_service_unit is changed }}"
    enabled: true
    state: "{{ 'restarted' if (bun_service_unit is changed or bun_service_restart | bool) else 'started' }}"
  when: bun_service_enabled | bool and not ansible_check_mode

- name: "[{{ bun_service_name }}] Disable and stop"
  ansible.builtin.systemd_service:
    name: "{{ bun_service_name }}"
    daemon_reload: "{{ bun_service_unit is changed }}"
    enabled: false
    state: stopped
  when: not (bun_service_enabled | bool) and not ansible_check_mode
