---
# Delivers one pinned commit of the research-ops Control Plane to the VM.
# The source is a local clone on the machine that runs Ansible (the app
# repository is private, so the VM holds no Git credentials):
#   export RESEARCH_OPS_REPO=/path/to/research-ops
research_ops_src_repo: "{{ lookup('env', 'RESEARCH_OPS_REPO') }}"
research_ops_git_version: ""    # full commit SHA, set in group_vars
research_ops_app_subdir: control-plane

research_ops_user: research-ops
research_ops_home: /opt/research-ops
research_ops_release_dir: "{{ research_ops_home }}/releases/{{ research_ops_git_version }}"
research_ops_current_dir: "{{ research_ops_home }}/current"

# Bun is installed from its release archive, checksum pinned. The version must
# match the "bun" entry the release's package.json pins (checked at deploy).
research_ops_bun_version: "1.4.4"
research_ops_bun_sha256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
research_ops_bun_dir: "/usr/local/lib/bun-{{ research_ops_bun_version }}"
research_ops_bun: "{{ research_ops_bun_dir }}/bun"

research_ops_config_dir: /etc/research-ops
research_ops_env_file: "{{ research_ops_config_dir }}/research-ops.env"
research_ops_database_url: ""   # secret; built in group_vars from the vault
# Who may call the API (Cloudflare Access). From terraform/cloudflare:
#   terraform -chdir=terraform/cloudflare output -json api_access
research_ops_access_team_domain: ""   # https://<team>.cloudflareaccess.com
research_ops_access_aud: ""           # Access application audience tag
research_ops_access_actors: {}        # service token client ID -> actor id
research_ops_access_observe_only: []  # actor ids that may only report observations (Bridges)
research_ops_overview_project_roots: []  # derived on the controller by the production playbook
# PI-approved host operations (research-ops control-plane README, "PI の操作").
research_ops_operation_runners: {}     # Bridge actor id -> hosts it runs approved operations on
research_ops_totp_secret: ""           # base32 TOTP secret the PI keeps in KeePassXC; empty: nothing can be approved

# Units stopped while a new release is migrated.
research_ops_units: [research-ops-api, research-ops-engine]
