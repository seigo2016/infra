---
- name: Install node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    policy_rc_d: 101

- name: Create metrics directory
  ansible.builtin.file:
    path: /var/lib/prometheus/node-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure localhost-only node exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      ARGS="--web.listen-address=127.0.0.1:9100 --collector.disable-defaults --collector.filesystem --collector.systemd --collector.systemd.unit-include=garage.service --collector.textfile --collector.textfile.directory=/var/lib/prometheus/node-exporter"
  notify: Restart node exporter

- name: Install backup metrics collector
  ansible.builtin.copy:
    src: garage-backup-metrics
    dest: /usr/local/sbin/garage-backup-metrics
    owner: root
    group: root
    mode: "0755"

- name: Install backup metrics units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - garage-backup-metrics.service
    - garage-backup-metrics.timer
  notify: Reload systemd for metrics timer

- name: Install Proxmox metrics collector
  ansible.builtin.copy:
    src: garage-pve-metrics
    dest: /usr/local/sbin/garage-pve-metrics
    owner: root
    group: root
    mode: "0755"

- name: Install Proxmox metrics units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - garage-pve-metrics.service
    - garage-pve-metrics.timer
  notify: Reload systemd for metrics timer

- name: Check for Proxmox monitoring credentials
  ansible.builtin.stat:
    path: /etc/garage-monitor/pve.json
  register: garage_pve_credentials

- name: Apply monitoring configuration
  ansible.builtin.meta: flush_handlers

- name: Enable node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Enable backup metrics timer
  ansible.builtin.systemd_service:
    name: garage-backup-metrics.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Configure Proxmox metrics timer
  ansible.builtin.systemd_service:
    name: garage-pve-metrics.timer
    enabled: "{{ garage_pve_credentials.stat.exists | bool }}"
    state: "{{ 'started' if garage_pve_credentials.stat.exists else 'stopped' }}"
  when: not ansible_check_mode
