# ZANSIN Environment Variables
## Decoupled from Terraform: values are read from environment
## Provide TF_VAR_* in your shell or .envrc before running Ansible.

control_server_ip: "{{ lookup('env','TF_VAR_control_ip') | default('192.168.1.100', true) }}"
training_server_ip: "{{ lookup('env','TF_VAR_training_ip') | default('192.168.1.101', true) }}" 
ssh_user: "{{ lookup('env','TF_VAR_ssh_user') | default('zansin', true) }}"
ssh_password: "{{ lookup('env','TF_VAR_ssh_password') | default('changeme', true) }}"

# ZANSIN Configuration
zansin_repo_url: "https://github.com/ZANSIN-sec/ZANSIN.git"
zansin_user: "zansin"
zansin_home: "/home/zansin"

# System packages required for ZANSIN
required_packages:
  - wget
  - curl
  - git
  - net-tools
  - ca-certificates

# Docker configuration
docker_users:
  - "zansin"
