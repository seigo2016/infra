---
# Public, non-secret variables for the research-ops Control Plane.
# Secrets live in vault.yml (ansible-vault encrypted; copy vault.yml.example).
# ansible/vars/research-ops-cp-restore-test.yml loads this file too and then
# overrides what must differ on the rehearsal VM.

system_timezone: Asia/Tokyo

# --- Application (research-ops control-plane) ---
research_ops_user: research-ops
research_ops_home: /opt/research-ops
# Full commit SHA of the research-ops repository to deploy. The local clone is
# $RESEARCH_OPS_REPO on the machine that runs Ansible.
research_ops_git_version: "ce73faee7fc0847481a8ea589302a5a4c7d912c0"
research_ops_app_subdir: control-plane
research_ops_api_port: 4100
# Present after a restore; the engine (dispatch) stays down until it is removed.
research_ops_dispatch_suspended_marker: /etc/research-ops-dispatch-suspended
research_ops_api_enabled: true
research_ops_engine_enabled: true

# --- PostgreSQL ---
postgresql_version: 18
research_ops_db_name: research_ops
research_ops_db_user: research_ops
postgresql_databases:
  - name: "{{ research_ops_db_name }}"
    owner: "{{ research_ops_db_user }}"
    password: "{{ vault_research_ops_db_password }}"
research_ops_database_url: >-
  postgres://{{ research_ops_db_user }}:{{ vault_research_ops_db_password }}@127.0.0.1:{{ postgresql_port | default(5432) }}/{{ research_ops_db_name }}
# Who may call the API (Cloudflare Access). Read from terraform/cloudflare's state on the
# controller, so the service tokens are never copied by hand (a hand copy put a trailing comma
# into every actor name, 2026-11-17..20). Only people (email -> short name) stay in the vault,
# because Terraform does not know them.
research_ops_access_terraform: >-
  {{ lookup('ansible.builtin.pipe', 'terraform -chdir=' ~ playbook_dir ~ '/../terraform/cloudflare output -json api_access') | from_json }}
research_ops_access_team_domain: "{{ research_ops_access_terraform.team_domain }}"
research_ops_access_aud: "{{ research_ops_access_terraform.aud }}"
research_ops_access_actors: >-
  {{ (vault_research_ops_access.actors | default({}) | dict2items | selectattr('key', 'search', '@') | items2dict)
     | combine(research_ops_access_terraform.actors) }}

# --- Backups (Cloudflare R2 bucket from terraform/cloudflare) ---
research_ops_backup_bucket: research-ops-cp-backup
pgbackrest_stanza: research-ops
pgbackrest_repo_s3_bucket: "{{ research_ops_backup_bucket }}"
pgbackrest_repo_path: /pgbackrest
pgbackrest_retention_full: 4
pgbackrest_archive_enabled: true
pgbackrest_manifest_source_database: "{{ research_ops_db_name }}"
postgresql_archive_enabled: "{{ pgbackrest_archive_enabled }}"
postgresql_archive_command: "pgbackrest --stanza={{ pgbackrest_stanza }} archive-push %p"
pg_dump_backup_database: "{{ research_ops_db_name }}"
pg_dump_backup_bucket: "{{ research_ops_backup_bucket }}"
# backup_timers_enabled is deliberately unset (null): timers stay as they are,
# and new timers stay disabled until run with -e backup_timers_enabled=true.

# --- Cloudflare Tunnel (token from `terraform -chdir=terraform/cloudflare output -raw tunnel_token`) ---
cloudflared_tunnel_token: "{{ vault_research_ops_cloudflared_tunnel_token }}"

# Bridges only report observations (the API refuses them anything else).
research_ops_access_observe_only: ["bridge-1", "bridge-mac"]
# bridge-1 (WSL) runs the PI-approved operations on WSL and, over ssh, on lab. Mac is not listed.
research_ops_operation_runners: {"bridge-1": ["wsl", "lab"]}
# The PI creates this in KeePassXC and adds it to the vault; agents never generate or read it.
research_ops_totp_secret: "{{ vault_research_ops_totp_secret | default('') }}"
