---
# Overrides for the restore rehearsal VM, loaded after
# group_vars/research-ops-cp/vars.yml. Each value keeps the rehearsal from
# writing to the shared backup repository or reaching the public edge.

# Never push WAL, never create or upgrade the stanza.
pgbackrest_archive_enabled: false
postgresql_archive_enabled: false
# No backup, expire or manifest units on this host.
pgbackrest_install_backup_units: false
backup_timers_enabled: false
# The restored cluster gets archive_mode=off written by pgBackRest.
pgbackrest_restore_archive_mode: "off"
# Read-only R2 key.
pgbackrest_s3_key: "{{ vault_pgbackrest_restore_s3_key }}"
pgbackrest_s3_key_secret: "{{ vault_pgbackrest_restore_s3_key_secret }}"
# Nothing is created before the restore overwrites the cluster.
postgresql_databases: []
