apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atuin-allow-tunnel-only
  namespace: atuin
spec:
  podSelector:
    matchLabels:
      app: atuin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 8888